<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>mason@lynaugh — ~/public</title>
  <meta name="description" content="Mason Lynaugh, Executive Director of Stand With Crypto. ATX DAO cofounder. Forbes 30 Under 30 Local Austin." />
  <style>
    :root {
      --bg:#0a0a0b;
      --fg:#d9d4c8;
      --red:#ff2a12;
      --dim:#6f6a61;
      --line:#22211f;
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    html, body { height:100%; }
    body {
      background:var(--bg);
      color:var(--fg);
      font-family:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      font-size:15px;
      line-height:1.55;
      -webkit-font-smoothing:antialiased;
      overflow:hidden;
    }
    ::selection { background:var(--red); color:#000; }

    /* faint CRT texture — subtle enough to read through */
    body::after {
      content:"";
      position:fixed; inset:0; z-index:5;
      pointer-events:none;
      background:
        repeating-linear-gradient(180deg, rgba(255,255,255,.030) 0 1px, transparent 1px 3px),
        radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(0,0,0,.55) 100%);
    }

    .bar {
      position:fixed; top:0; left:0; right:0; z-index:4;
      background:var(--bg);
      border-bottom:1px solid var(--line);
      padding:9px 14px;
      font-size:11px;
      letter-spacing:.14em;
      text-transform:uppercase;
      color:var(--dim);
      display:flex;
      justify-content:space-between;
      gap:12px;
    }
    .bar b { color:var(--red); font-weight:400; }

    .term {
      height:100%;
      overflow-y:auto;
      overflow-x:hidden;
      padding:52px 16px 28px;
      cursor:text;
      -webkit-overflow-scrolling:touch;
    }
    .wrap { max-width:74ch; }

    .cmd { color:var(--red); }
    .cmd .ps1 { color:var(--dim); margin-right:.6ch; }
    .out { white-space:pre-wrap; word-break:break-word; }
    .out.gap { margin-bottom:1.05em; }
    .dim { color:var(--dim); }
    .key { color:var(--red); }
    a { color:var(--fg); text-underline-offset:3px; }
    a:hover { background:var(--red); color:#000; text-decoration:none; }

    .src { color:var(--dim); }

    .shot {
      display:block;
      max-width:min(540px, 100%);
      height:auto;
      margin:.55em 0 .3em;
      border:1px solid var(--line);
    }

    /* live input line */
    .line { display:flex; align-items:baseline; gap:.6ch; }
    .line .ps1 { color:var(--dim); flex:none; }
    #in {
      flex:1 1 auto;
      min-width:0;
      background:transparent;
      border:0;
      outline:0;
      color:var(--red);
      font:inherit;
      caret-color:var(--red);
      padding:0;
    }
    .caret {
      display:inline-block;
      width:.62ch; height:1.05em;
      background:var(--red);
      transform:translateY(.18em);
      animation:blink 1.05s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity:0; } }
    .line.busy #in { display:none; }
    .line.done .caret { display:none; }

    @media (max-width:600px) {
      body { font-size:14px; }
      #in { font-size:16px; }  /* keeps iOS from zooming on focus */
      .term { padding:50px 13px 24px; }
      .bar span:last-child { display:none; }  /* no room for the subtitle */
    }
    @media (prefers-reduced-motion: reduce) {
      .caret { animation:none; }
    }
  </style>
</head>
<body>
  <div class="bar">
    <span>mason<b>@</b>lynaugh — ~/public</span>
    <span class="dim">executive director · stand with crypto</span>
  </div>

  <main class="term" id="term" role="log" aria-live="polite">
    <div class="wrap" id="wrap">
      <div id="scroll"></div>
      <div class="line busy" id="line">
        <span class="ps1">$</span>
        <input id="in" autocomplete="off" autocorrect="off" autocapitalize="off"
               spellcheck="false" aria-label="terminal input" />
        <span class="caret" id="caret"></span>
      </div>
    </div>
  </main>

  <noscript>
    <div style="padding:60px 16px;max-width:74ch">
      <h1 style="font-size:1.4rem;margin-bottom:.6em">Mason Lynaugh</h1>
      <p style="margin-bottom:1em">Executive Director, Stand With Crypto. ATX DAO cofounder.
      Forbes 30 Under 30 Local Austin. Ground game for 3M+ crypto advocates.</p>
      <p><a href="https://www.standwithcrypto.org">Stand With Crypto</a> ·
         <a href="https://x.com/masonlynaugh">X</a> ·
         <a href="https://www.linkedin.com/in/masonlynaugh">LinkedIn</a> ·
         <a href="https://github.com/masonleenaugh">GitHub</a></p>
    </div>
  </noscript>

<script>
(function () {
  "use strict";

  var term   = document.getElementById("term");
  var scroll = document.getElementById("scroll");
  var line   = document.getElementById("line");
  var input  = document.getElementById("in");

  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var PRESS = [
    { n:"01", q:"2026 is where we prove that the crypto voter is a defining constituency for the next generation.",
      src:"Punchbowl News · Sep 2025",
      url:"https://punchbowl.news/article/vault/stand-with-crypto-seeks-voters/" },
    { n:"02", q:"The Clarity Act on the floor will be the most important vote that lawmakers have ever taken as it pertains to crypto.",
      src:"The Block · May 2026",
      url:"https://www.theblock.co/news/regulation/2026-05-14-senate-banking-committee-advances-landmark-crypto-market-structure-bill-garners-some-democratic-support-401341" },
    { n:"03", q:"This year crypto voters are poised to play a powerful and decisive role at the ballot box.",
      src:"crypto.news · Consensus Miami 2026",
      url:"https://crypto.news/mason-lynaugh-lays-out-crypto-midterm-plan/" },
    { n:"04", q:"They overlook crypto voters at their own peril.",
      src:"CoinDesk · Aug 2026",
      url:"https://www.coindesk.com/policy/2026/08/24/crypto-political-group-details-list-of-u-s-congressional-allies-its-backing-this-year" }
  ];

  var LINKS = [
    ["stand with crypto", "https://www.standwithcrypto.org"],
    ["x",                 "https://x.com/masonlynaugh"],
    ["linkedin",          "https://www.linkedin.com/in/masonlynaugh"],
    ["github",            "https://github.com/masonleenaugh"]
  ];

  var PHOTOS = {
    "iceland":   { file:"hero.jpg",      cap:"westfjords, iceland · 35mm" },
    "consensus": { file:"consensus.jpg", cap:"consensus miami · 2026" },
    "portrait":  { file:"portrait.jpg",  cap:"stand with crypto · portrait" }
  };

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c];
    });
  }
  function link(href, text) {
    return '<a href="' + esc(href) + '" target="_blank" rel="noopener noreferrer">' + esc(text) + "</a>";
  }
  function atBottom() {
    return term.scrollHeight - term.scrollTop - term.clientHeight < 40;
  }
  function toBottom() { term.scrollTop = term.scrollHeight; }

  function emit(html, gap) {
    var d = document.createElement("div");
    d.className = "out" + (gap === false ? "" : " gap");
    d.innerHTML = html;
    scroll.appendChild(d);
    toBottom();
    return d;
  }
  function echoCmd(text) {
    var d = document.createElement("div");
    d.className = "cmd";
    d.innerHTML = '<span class="ps1">$</span>' + esc(text);
    scroll.appendChild(d);
    toBottom();
  }

  // ---- commands ------------------------------------------------------------

  var COMMANDS = {
    help: function () {
      var rows = [
        ["whoami",      "who is this"],
        ["about",       "the short version"],
        ["press",       "what people quoted"],
        ["press <n>",   "one quote in full (01–04)"],
        ["photos",      "list the photographs"],
        ["open <name>", "view one (iceland, consensus, portrait)"],
        ["links",       "where else to find me"],
        ["clear",       "wipe the screen"]
      ];
      return rows.map(function (r) {
        return '<span class="key">' + r[0] + "</span>" +
               " ".repeat(Math.max(1, 14 - r[0].length)) +
               '<span class="dim">' + r[1] + "</span>";
      }).join("\n");
    },

    whoami: function () { return "mason lynaugh"; },

    role: function () { return "executive director · stand with crypto"; },

    about: function () {
      return "executive director at stand with crypto.\n" +
             "atx dao cofounder. forbes 30 under 30, local austin.\n" +
             "ground game for 3m+ crypto advocates.";
    },

    press: function (arg) {
      if (arg) {
        var hit = PRESS.filter(function (p) { return p.n === arg || p.n === ("0" + arg) || String(Number(p.n)) === arg; })[0];
        if (!hit) return '<span class="dim">no such entry. try: press 01</span>';
        return '"' + esc(hit.q) + '"\n' +
               '<span class="src">— ' + esc(hit.src) + " · " + link(hit.url, "read") + "</span>";
      }
      return PRESS.map(function (p) {
        return '<span class="key">' + p.n + "</span>  " + esc(p.q) +
               '\n      <span class="src">' + esc(p.src) + " · " + link(p.url, "read") + "</span>";
      }).join("\n\n") + '\n\n<span class="dim">press &lt;n&gt; for one on its own</span>';
    },

    links: function () {
      return LINKS.map(function (l) {
        return '<span class="key">' + l[0] + "</span>" +
               " ".repeat(Math.max(1, 18 - l[0].length)) + link(l[1], l[1].replace(/^https?:\/\//, ""));
      }).join("\n");
    },

    photos: function () {
      return Object.keys(PHOTOS).map(function (k) {
        return '<span class="key">' + k + "</span>" +
               " ".repeat(Math.max(1, 12 - k.length)) +
               '<span class="dim">' + PHOTOS[k].cap + "</span>";
      }).join("\n") + '\n\n<span class="dim">open &lt;name&gt; to view</span>';
    },

    open: function (arg) {
      var p = PHOTOS[(arg || "").toLowerCase()];
      if (!p) return '<span class="dim">no such photo. try: photos</span>';
      return '<img class="shot" src="' + p.file + '" alt="' + esc(p.cap) + '" loading="lazy" />' +
             '<span class="dim">' + esc(p.cap) + "</span>";
    },

    ls: function (arg) {
      if (arg && /^press/.test(arg)) {
        return PRESS.map(function (p) { return p.n + "_" + p.src.split(" ·")[0].toLowerCase().replace(/[^a-z.]+/g, "") + ".txt"; }).join("\n");
      }
      return "about.txt   press/   photos/   links.txt";
    },

    clear: function () { scroll.innerHTML = ""; return null; },

    sudo: function () { return '<span class="dim">nice try.</span>'; },
    exit: function () { return '<span class="dim">there is no exit. that is rather the point.</span>'; }
  };

  COMMANDS.bio = COMMANDS.about;
  COMMANDS.contact = COMMANDS.links;
  COMMANDS.cat = function (arg) {
    var a = (arg || "").replace(/\.txt$/, "");
    if (a === "about") return COMMANDS.about();
    if (a === "links") return COMMANDS.links();
    if (a === "role")  return COMMANDS.role();
    return '<span class="dim">cat: ' + esc(arg || "") + ": no such file</span>";
  };

  function run(raw) {
    var text = raw.trim();
    if (!text) return;
    var parts = text.split(/\s+/);
    var name  = parts[0].toLowerCase();
    var arg   = parts.slice(1).join(" ");

    var fn = COMMANDS[name];
    if (!fn) {
      emit('<span class="dim">' + esc(name) + ": command not found. try " + '</span><span class="key">help</span>');
      return;
    }
    var out = fn(arg);
    if (out !== null && out !== undefined) emit(out);
  }

  // ---- boot sequence -------------------------------------------------------

  var BOOT = [
    { cmd:"whoami", out:function () { return COMMANDS.whoami(); } },
    { cmd:"cat about.txt", out:function () { return COMMANDS.about(); } }
  ];

  var typing = false, skip = false;

  function typeInto(el, text, speed) {
    return new Promise(function (resolve) {
      if (reduced || skip) { el.textContent = text; resolve(); return; }
      var i = 0;
      (function step() {
        if (skip) { el.textContent = text; toBottom(); resolve(); return; }
        el.textContent = text.slice(0, ++i);
        if (atBottom()) toBottom();
        if (i >= text.length) { resolve(); return; }
        setTimeout(step, speed + Math.random() * speed);
      })();
    });
  }

  function pause(ms) {
    return new Promise(function (r) { setTimeout(r, (reduced || skip) ? 0 : ms); });
  }

  async function boot() {
    typing = true;
    for (var i = 0; i < BOOT.length; i++) {
      var row = document.createElement("div");
      row.className = "cmd";
      var ps = document.createElement("span");
      ps.className = "ps1";
      ps.textContent = "$";
      var body = document.createElement("span");
      row.appendChild(ps); row.appendChild(body);
      scroll.appendChild(row);
      toBottom();

      await typeInto(body, BOOT[i].cmd, 26);
      await pause(160);
      emit(BOOT[i].out());
      await pause(220);
    }
    emit('<span class="dim">type </span><span class="key">help</span><span class="dim"> for what else is here</span>');
    typing = false;
    line.classList.remove("busy");
    focusInput();
  }

  // ---- input plumbing ------------------------------------------------------

  var history = [], hpos = -1;

  function focusInput() {
    if (!typing) input.focus({ preventScroll:true });
  }

  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      e.preventDefault();
      var v = input.value;
      echoCmd(v);
      input.value = "";
      if (v.trim()) { history.push(v); hpos = history.length; }
      run(v);
      toBottom();
    } else if (e.key === "ArrowUp") {
      e.preventDefault();
      if (hpos > 0) { hpos--; input.value = history[hpos]; }
    } else if (e.key === "ArrowDown") {
      e.preventDefault();
      if (hpos < history.length - 1) { hpos++; input.value = history[hpos]; }
      else { hpos = history.length; input.value = ""; }
    } else if (e.key === "l" && e.ctrlKey) {
      e.preventDefault();
      scroll.innerHTML = "";
    }
  });

  // tapping anywhere returns focus to the prompt (and opens the keyboard on phones)
  term.addEventListener("click", function (e) {
    if (window.getSelection().toString()) return;   // don't steal focus mid-copy
    if (e.target.closest("a")) return;
    focusInput();
  });

  // any key or click during the boot sequence skips it
  function requestSkip() { if (typing) skip = true; }
  document.addEventListener("keydown", requestSkip, { once:false });
  document.addEventListener("click", requestSkip);

  boot();
})();
</script>
</body>
</html>
