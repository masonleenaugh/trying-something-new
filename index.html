<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mason is trying something new</title>
  <meta name="description" content="Mason is trying something new with Grok Bot!" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #14110f;
      --paper: #f3ead7;
      --accent: #e23d28;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      background: var(--ink);
      color: var(--paper);
      font-family: "Instrument Serif", Georgia, serif;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: -20%;
      background:
        radial-gradient(ellipse at 20% 10%, rgba(226, 61, 40, 0.22), transparent 42%),
        radial-gradient(ellipse at 90% 90%, rgba(243, 234, 215, 0.08), transparent 40%);
      pointer-events: none;
    }

    main {
      position: relative;
      z-index: 1;
      width: min(920px, calc(100% - 48px));
      text-align: center;
    }

    .mark {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 12px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 28px;
    }

    h1 {
      font-size: clamp(2.4rem, 8vw, 5.6rem);
      font-weight: 400;
      line-height: 0.95;
      letter-spacing: -0.03em;
    }

    h1 em {
      font-style: italic;
      color: var(--paper);
    }

    .rule {
      width: 48px;
      height: 3px;
      background: var(--accent);
      margin: 36px auto 0;
    }
  </style>
</head>
<body>
  <main>
    <p class="mark">Live experiment</p>
    <h1>Mason is trying something new with <em>Grok Bot</em>!</h1>
    <div class="rule" aria-hidden="true"></div>
  </main>
</body>
</html>
