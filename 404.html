<!DOCTYPE html>

  <style>
    /* Self-hosted so the page makes no third-party request. IBM Plex Mono is
       licensed under the SIL Open Font License 1.1; see fonts/OFL.txt.
       unicode-range means the browser fetches only the subset it needs. */
    @font-face {
      font-family:"IBM Plex Mono";
      font-style:normal;
      font-weight:400;
      font-display:swap;
      src:url("/fonts/ibm-plex-mono-400-latin.woff2") format("woff2");
      unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    @font-face {
      font-family:"IBM Plex Mono";
      font-style:normal;
      font-weight:400;
      font-display:swap;
      src:url("/fonts/ibm-plex-mono-400-latin-ext.woff2") format("woff2");
      unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
    }
    :root { --bg:#0a0a0b; --fg:#d9d4c8; --accent:#a770ff; --dim:#9a9286; --line:#232220; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body {
      background:var(--bg); color:var(--fg);
      font-family:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased;
      min-height:100vh; display:flex; align-items:center; padding:40px 20px;
    }
    ::selection { background:var(--accent); color:#000; }
    .wrap { max-width:52ch; }
    .path { color:var(--dim); font-size:11px; letter-spacing:.18em; text-transform:uppercase; margin-bottom:2.4em; }
    .path b { color:var(--accent); font-weight:400; }
    h1 { font-size:clamp(2.1rem,7.5vw,3.6rem); font-weight:400; letter-spacing:-.04em;
         word-spacing:-.3em; line-height:1; margin-bottom:.4em; }
    p { color:var(--fg); margin-bottom:1.9em; }
    a { color:var(--accent); text-decoration:none;
        border-bottom:1px solid rgba(167,112,255,.45); padding-bottom:3px;
        font-size:12px; letter-spacing:.2em; text-transform:uppercase; }
    a:hover { background:var(--accent); color:#000; border-bottom-color:transparent; }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="path">404<b> // </b>not found</p>
